name: frontend
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  go_router: ^18.0.1
  file_picker: ^13.1.0
  socket_io_client: ^3.1.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  geolocator: ^14.0.1
  image_picker: ^1.2.4
  pdfrx: ^2.12.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


# Íconos de la app (logo Dron-cruz). Las imágenes salen de
# Airdrop_Products/_brand/logo/app. Para regenerarlos:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/launcher/app-icon-1024.png"
  android: true
  adaptive_icon_foreground: "assets/launcher/adaptive-foreground-1024.png"
  adaptive_icon_background: "assets/launcher/adaptive-background-1024.png"
  # El frente ya trae el margen de la zona segura (66 dp); sin inset extra.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/launcher/app-icon-1024.png"
    background_color: "#17191B"
    theme_color: "#17191B"
